[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-analytics"
version = "0.1.0"
description = "AIFluent — Multimodal Document Processing, Retrieval, and Query Pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Auto Generator" }
]
dependencies = [
    "lightrag-hku>=1.0.0",
    "mineru>=1.0.0",
    "docling>=2.0.0",
    "paddleocr>=2.7.0",
    "openai>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.3",
    "scipy>=1.11.1",
    "pandas>=2.0.3",
    "matplotlib>=3.7.1",
    "seaborn>=0.12.2",
    "click>=8.1.7",
    "scikit-learn>=1.3.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
notebooks = [
    "jupyterlab>=4.0.0",
    "papermill>=2.4.0",
]
evaluation = [
    "datasets>=2.14.0",
    "evaluate>=0.4.0",
]

[project.scripts]
multimodal-analytics = "src.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["aifluent*", "evaluation*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
